name: NBG on-demand request
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Request type
        required: true
        type: choice
        options: [overview, refresh, terms]
      request_id:
        description: Opaque request ID (24 lowercase hex characters)
        required: true
        type: string
      row_key:
        description: Current NBG record key for terms (nbg:123)
        required: false
        default: ""
        type: string

permissions:
  contents: write
concurrency:
  group: nbg-monitor
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Answer the request
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_ROW_KEY: ${{ inputs.row_key }}
        run: python on_demand.py --mode "$REQUEST_MODE" --request-id "$REQUEST_ID" --row-key "$REQUEST_ROW_KEY"
      - name: Persist state and delivery receipts even after failure
        if: ${{ always() }}
        run: |
          git config user.name "nbg-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Save NBG requested check"
          git pull --rebase origin main
          git push origin HEAD:main

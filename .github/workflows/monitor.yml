name: NBG prospectus monitor

on:
  schedule:
    # Four page requests a day: 08:15, 12:15, 16:15, 20:15 Tbilisi (UTC+4).
    - cron: "15 4,8,12,16 * * *"
    # Digest reads saved data only. GitHub schedules can run late.
    - cron: "0 17 * * *"
  push:
    branches: [main]
    paths: [monitor.py, registry.py, prospectus.py, requirements.txt, .github/workflows/monitor.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options: [check, digest]

permissions:
  contents: write

concurrency:
  group: nbg-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "0 17 * * *" ] || [ "$MODE" = "digest" ]; then
            python monitor.py --digest
          else
            python monitor.py
          fi
      - name: Persist state even after a fetch or delivery failure
        if: ${{ always() }}
        run: |
          git config user.name "nbg-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NBG state"
          git pull --rebase origin main
          git push origin HEAD:main

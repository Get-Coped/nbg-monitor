name: NBG prospectus monitor

on:
  schedule:
    # Four page requests a day: 08:15, 12:15, 16:15, 20:15 Tbilisi (UTC+4).
    - cron: "15 4,8,12,16 * * *"
    # Digest reads saved data only. GitHub schedules can run late.
    - cron: "0 17 * * *"
  push:
    branches: [main]
    paths: [telegram_relay.py, monitor.py, registry.py, prospectus.py, requirements.txt, .github/workflows/monitor.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options: [check, digest]

permissions:
  contents: write
  actions: read

concurrency:
  group: nbg-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_WORKER_URL: https://nbg-telegram-requests.nikakopaleishvili40.workers.dev
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SCHEDULE" = "0 17 * * *" ]; then
            # Anchor to workflow creation, so waiting for a runner or rerunning
            # tomorrow cannot change which daily slot this run belongs to.
            python - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          import requests
          from monitor import scheduled_digest_date

          response = requests.get(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
              timeout=30)
          response.raise_for_status()
          created = datetime.fromisoformat(response.json()["created_at"].replace("Z", "+00:00"))
          subprocess.run(["python", "monitor.py", "--digest", "--digest-date", scheduled_digest_date(created)], check=True)
          PY
          elif [ "$MODE" = "digest" ]; then
            python monitor.py --digest
          else
            python monitor.py
          fi
      - name: Persist state even after a fetch or delivery failure
        if: ${{ always() }}
        run: |
          git config user.name "nbg-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NBG state"
          git pull --rebase origin main
          git push origin HEAD:main

name: NBG prospectus monitor
# The Cloudflare Worker reads this title to confirm that a job it started finished.
run-name: ${{ (inputs.mode == 'digest' || github.event.schedule == '30 17 * * *') && 'NBG digest' || 'NBG check' }}

on:
  schedule:
    # BACKUP ONLY. GitHub starts scheduled jobs hours late and drops some, so the
    # Cloudflare Worker (telegram-worker/wrangler.toml) starts checks and the 21:00
    # digest on time through workflow_dispatch. These run if the Worker ever cannot.
    - cron: "15 4,8,12,16 * * *"
    # Backup digest: skipped when tonight's 21:00 digest was already delivered.
    - cron: "30 17 * * *"
  push:
    branches: [main]
    paths: [telegram_relay.py, monitor.py, registry.py, prospectus.py, requirements.txt, .github/workflows/monitor.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options: [check, digest]

permissions:
  contents: write

concurrency:
  group: nbg-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_WORKER_URL: https://nbg-telegram-requests.nikakopaleishvili40.workers.dev
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "30 17 * * *" ] || [ "$MODE" = "digest" ]; then
            python monitor.py --digest
          else
            python monitor.py
          fi
      - name: Persist state even after a fetch or delivery failure
        if: ${{ always() }}
        run: |
          git config user.name "nbg-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NBG state"
          git pull --rebase origin main
          git push origin HEAD:main

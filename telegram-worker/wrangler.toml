# TOML also lets retries of older deployment runs read this configuration.
name = "nbg-telegram-requests"
main = "src/worker.js"
compatibility_date = "2026-09-14"
workers_dev = true

[vars]
GITHUB_REPOSITORY = "Get-Coped/nbg-monitor"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "FRIENDS"
class_name = "FriendsHub"

[[migrations]]
tag = "friends-v1"
new_sqlite_classes = ["FriendsHub"]

# TOML also lets retries of older deployment runs read this configuration.
name = "nbg-telegram-requests"
main = "src/worker.js"
compatibility_date = "2026-09-14"
workers_dev = true

[vars]
GITHUB_REPOSITORY = "Get-Coped/nbg-monitor"

# Tbilisi is UTC+4. Two-minute NBG poll 09:00-19:00 (weekdays are filtered in code),
# one full check at 20:45, and the 21:00 digest with retries through the hour.
[triggers]
crons = ["*/2 5-14 * * *", "45 16 * * *", "*/5 17 * * *"]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "FRIENDS"
class_name = "FriendsHub"

[[migrations]]
tag = "friends-v1"
new_sqlite_classes = ["FriendsHub"]
